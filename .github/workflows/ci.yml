name: AirSocket CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java: [ '21' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Sources
        run: mvn compile

      - name: Run Test Suite
        run: mvn test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  quality-and-analysis:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle Static Analysis
        run: mvn checkstyle:check

      - name: Run SpotBugs Inspection
        run: mvn compile spotbugs:check

      - name: Generate JaCoCo Code Coverage
        run: mvn test jacoco:report

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  package-distribution:
    name: Package Release Artifact
    needs: [ build-and-test, quality-and-analysis ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package Executable Fat JAR
        run: mvn clean package -DskipTests

      - name: Verify Executable JAR
        run: java -jar target/airsocket-1.0.0.jar --help

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airsocket-fat-jar
          path: target/airsocket-1.0.0.jar
